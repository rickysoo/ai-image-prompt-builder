        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: 
                radial-gradient(circle at 15% 85%, rgba(16, 185, 129, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 85% 15%, rgba(139, 92, 246, 0.12) 0%, transparent 40%),
                radial-gradient(circle at 50% 50%, rgba(6, 182, 212, 0.08) 0%, transparent 30%),
                radial-gradient(circle at 30% 20%, rgba(245, 158, 11, 0.1) 0%, transparent 35%),
                radial-gradient(circle at 70% 80%, rgba(239, 68, 68, 0.08) 0%, transparent 35%);
            pointer-events: none;
            z-index: 1;
        }

        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        .particle {
            position: absolute;
            pointer-events: none;
            z-index: 1;
        }

        .particle.circle {
            background: radial-gradient(circle, rgba(255, 255, 255, 0.2) 0%, rgba(120, 119, 198, 0.1) 100%);
            border-radius: 50%;
            animation: floatCircle 12s ease-in-out infinite;
        }

        .particle.square {
            background: linear-gradient(45deg, rgba(255, 255, 255, 0.15) 0%, rgba(120, 119, 198, 0.1) 100%);
            border-radius: 2px;
            animation: floatSquare 15s ease-in-out infinite;
        }

        .particle.triangle {
            width: 0;
            height: 0;
            background: transparent;
            border-left: 3px solid transparent;
            border-right: 3px solid transparent;
            border-bottom: 6px solid rgba(255, 255, 255, 0.15);
            border-radius: 0;
            animation: floatTriangle 10s ease-in-out infinite;
        }

        .particle.diamond {
            background: linear-gradient(45deg, rgba(255, 255, 255, 0.2) 0%, transparent 50%, rgba(120, 119, 198, 0.1) 100%);
            border-radius: 0;
            transform: rotate(45deg);
            animation: floatDiamond 14s ease-in-out infinite;
        }

        @keyframes floatCircle {
            0%, 100% { 
                transform: translateY(0px) translateX(0px) rotate(0deg) scale(1); 
                opacity: 0.3; 
            }
            25% { 
                transform: translateY(-20px) translateX(10px) rotate(90deg) scale(1.2); 
                opacity: 0.6; 
            }
            50% { 
                transform: translateY(-40px) translateX(-5px) rotate(180deg) scale(0.8); 
                opacity: 0.9; 
            }
            75% { 
                transform: translateY(-25px) translateX(-15px) rotate(270deg) scale(1.1); 
                opacity: 0.5; 
            }
        }

        @keyframes floatSquare {
            0%, 100% { 
                transform: translateY(0px) translateX(0px) rotate(0deg) scale(1); 
                opacity: 0.2; 
            }
            33% { 
                transform: translateY(-30px) translateX(15px) rotate(120deg) scale(1.3); 
                opacity: 0.7; 
            }
            66% { 
                transform: translateY(-15px) translateX(-20px) rotate(240deg) scale(0.7); 
                opacity: 0.4; 
            }
        }

        @keyframes floatTriangle {
            0%, 100% { 
                transform: translateY(0px) translateX(0px) rotate(0deg) scale(1); 
                opacity: 0.4; 
            }
            50% { 
                transform: translateY(-35px) translateX(8px) rotate(180deg) scale(1.1); 
                opacity: 0.8; 
            }
        }

        @keyframes floatDiamond {
            0%, 100% { 
                transform: translateY(0px) translateX(0px) rotate(45deg) scale(1); 
                opacity: 0.3; 
            }
            25% { 
                transform: translateY(-25px) translateX(12px) rotate(135deg) scale(1.4); 
                opacity: 0.6; 
            }
            50% { 
                transform: translateY(-45px) translateX(-8px) rotate(225deg) scale(0.9); 
                opacity: 0.9; 
            }
            75% { 
                transform: translateY(-20px) translateX(-18px) rotate(315deg) scale(1.2);

        .component-section::before {
            content: '';

            top: 50%;

            width: 100%;

            background: radial-gradient(circle, rgba(255,255,255,0.1) 0%, transparent 70%);
            transform: translate(-50%, -50%) scale(0);
            transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            opacity: 0;
            pointer-events: none;

        .component-section:hover::after {
            transform: translate(-50%, -50%) scale(1);
            opacity: 1;

        .component-list {
            display: flex;
            flex-wrap: wrap;

        .component-item {
            color: white;
            border: none;
            border-radius: 12px;
            padding: 0.4rem 0.6rem;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            align-items: center;
            gap: 0.3rem;
            font-size: 0.75rem;
            font-weight: 600;
            position: relative;
            backdrop-filter: blur(10px);
            min-width: fit-content;
            white-space: nowrap;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .component-item::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            border-radius: 8px;
            background: linear-gradient(45deg, rgba(255, 255, 255, 0.2), transparent);
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .component-item:hover::before {
            opacity: 1;
        }

            transform: translateY(-6px) scale(1.08) rotate(1deg);
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .component-item[data-category="subject"] {

        .workspace {
            background: linear-gradient(135deg, 
                rgba(255, 255, 255, 0.15) 0%, 
                rgba(139, 92, 246, 0.08) 25%,
                rgba(6, 182, 212, 0.06) 50%,
                rgba(16, 185, 129, 0.08) 75%,
                rgba(255, 255, 255, 0.12) 100%);
            backdrop-filter: blur(30px) saturate(200%);
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 24px;
            padding: 1.5rem;
            box-shadow: 
                0 16px 50px rgba(0, 0, 0, 0.25),
                inset 0 2px 0 rgba(255, 255, 255, 0.3),
                inset 0 -2px 0 rgba(255, 255, 255, 0.1);
            flex: 1;
            display: grid;
            grid-template-columns: 1fr 1fr auto;
            gap: 1.5rem;
            align-items: start;
            position: relative;
            overflow: hidden;
        }

        .workspace::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: conic-gradient(from 0deg, 
                transparent, 
                rgba(16, 185, 129, 0.05), 
                transparent, 
                rgba(6, 182, 212, 0.08), 
                transparent,
                rgba(139, 92, 246, 0.06),
                transparent,
                rgba(245, 158, 11, 0.05),
                transparent);
            animation: workspaceRotate 25s linear infinite;
            pointer-events: none;
        }

        @keyframes workspaceRotate {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }

        .buttons-area {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;

        .action-button {
            background: linear-gradient(135deg, #10b981, #059669);

            padding: 0.7rem 1rem;
            border-radius: 14px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 
                0 4px 15px rgba(16, 185, 129, 0.3),
                inset 0 1px 0 rgba(255, 255, 255, 0.2);

            font-size: 0.85rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }

        .action-button:hover {
            transform: translateY(-3px) scale(1.05);
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            box-shadow: 0 8px 25px rgba(16, 185, 129, 0.5);

        .clear-all-btn {
            background: linear-gradient(135deg, #ef4444, #dc2626);

        .drop-area {
            display: flex;
            flex-direction: column;
        }

        .prompt-area {
            display: flex;
            flex-direction: column;
            height: 100%;
        }

        .drop-zone {
            min-height: 130px;
            border: 3px dashed rgba(255, 255, 255, 0.5);
            border-radius: 20px;
            padding: 1.2rem;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.12) 0%, rgba(255, 255, 255, 0.05) 100%);
            backdrop-filter: blur(15px);
            display: flex;
            flex-wrap: wrap;
            gap: 0.6rem;
            align-items: center;
            justify-content: center;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            flex: 1;
            box-shadow: inset 0 2px 4px rgba(255, 255, 255, 0.1);
        }

        .drop-zone::before {
            content: '';
            position: absolute;
            top: -2px;
            left: -2px;
            right: -2px;
            bottom: -2px;
            background: linear-gradient(45deg, transparent, rgba(255, 255, 255, 0.1), transparent);
            border-radius: 22px;
            z-index: -1;
            opacity: 0;
            transition: opacity 0.4s ease;
        }

        .drop-zone:hover::before {
            opacity: 1;
        }

        .drop-zone.drag-over {
            border-color: #fbbf24;
            background: linear-gradient(135deg, rgba(251, 191, 36, 0.2) 0%, rgba(251, 191, 36, 0.1) 100%);
            box-shadow: 
                0 0 50px rgba(251, 191, 36, 0.4),
                inset 0 0 20px rgba(251, 191, 36, 0.2);
            transform: scale(1.03) rotate(0.5deg);
            backdrop-filter: blur(20px) saturate(150%);
        }

        .drop-zone.empty::before {
            content: "🎯 Drop or Click Components Here! 🎯";
            color: rgba(255, 255, 255, 0.8);
            font-size: 1.3rem;
            font-weight: 700;
            text-align: center;
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.6; }
            50% { opacity: 1; }
        }

        .prompt-component {
            color: white;
            padding: 0.6rem 1rem;
            border-radius: 16px;
            font-size: 0.9rem;
            font-weight: 600;
            position: relative;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            animation: bounceIn 0.6s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            box-shadow: 
                0 6px 20px rgba(0, 0, 0, 0.25),
                inset 0 1px 0 rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.15);
        }

        @keyframes bounceIn {
            0% {
                opacity: 0;
                transform: scale(0.3) rotate(-10deg);
            }
            50% {
                opacity: 1;
                transform: scale(1.15) rotate(5deg);
            }
            100% {
                opacity: 1;
                transform: scale(1) rotate(0deg);
            }
        }

        .prompt-component[data-category="subject"] {
            background: linear-gradient(135deg, #10b981, #059669);
        }

        .prompt-component[data-category="style"] {
            background: linear-gradient(135deg, #f59e0b, #d97706);
        }

        .prompt-component[data-category="lighting"] {
            background: linear-gradient(135deg, #ef4444, #dc2626);
        }

        .prompt-component[data-category="technical"] {
            background: linear-gradient(135deg, #8b5cf6, #7c3aed);
        }

        .prompt-component[data-category="framing"] {
            background: linear-gradient(135deg, #14b8a6, #0d9488);
        }

        .remove-btn {

        .remove-btn:active {

            transition: all 0.15s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .prompt-display {
            background: linear-gradient(135deg, rgba(0, 0, 0, 0.4) 0%, rgba(0, 0, 0, 0.2) 100%);
            border: 2px solid rgba(255, 255, 255, 0.4);

                inset 0 1px 0 rgba(255, 255, 255, 0.1);
            overflow-y: auto;
            margin-bottom: 0.75rem;
            backdrop-filter: blur(10px);
            position: relative;
            outline: none;
            cursor: text;
        }
        
        .prompt-display:focus {
            border-color: rgba(255, 255, 255, 0.6);
            box-shadow: 
                inset 0 4px 20px rgba(0, 0, 0, 0.3),
                inset 0 1px 0 rgba(255, 255, 255, 0.1),
                0 0 0 3px rgba(255, 255, 255, 0.1);
        }

        .prompt-display::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(135deg, transparent, rgba(255, 255, 255, 0.05), transparent);
            border-radius: 18px;
            pointer-events: none;
        }

        .prompt-display.empty {
            color: rgba(255, 255, 255, 0.6);
            font-style: italic;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;

        .prompt-title {
            font-size: 1.1rem;
            font-weight: 700;
            text-align: center;
            margin-bottom: 0.75rem;
            color: rgba(255, 255, 255, 0.95);
            flex-shrink: 0;
        }

        .notification {
            position: fixed;
            top: 20px;
            right: 20px;
            background: linear-gradient(135deg, #10b981, #059669);
            color: white;
            padding: 1rem 1.5rem;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(16, 185, 129, 0.4);
            z-index: 1000;
            transform: translateX(100%);
            transition: transform 0.4s ease;
            font-weight: 600;
        }

        .notification.show {
            transform: translateX(0);
        }

        .notification.error {
            background: linear-gradient(135deg, #ef4444, #dc2626);
            box-shadow: 0 10px 40px rgba(239, 68, 68, 0.4);
        }

        .notification.warning {
            background: linear-gradient(135deg, #f59e0b, #d97706);
            box-shadow: 0 10px 40px rgba(245, 158, 11, 0.4);
        }

        /* Tooltips */
        .dynamic-tooltip {
            position: fixed;
            background: linear-gradient(135deg, rgba(30, 60, 114, 0.95) 0%, rgba(44, 82, 130, 0.95) 100%);
            color: white;
            padding: 0.75rem 1rem;

            opacity: 0;
            visibility: hidden;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            pointer-events: none;
            z-index: 10000;
            max-width: 280px;
            text-align: left;
        }

        .dynamic-tooltip.show {
            opacity: 1;
            visibility: visible;
        }

        .tooltip-trigger {
            cursor: help;
        }

        /* ===== STAMPX page ===== */

        /* Sections in STAMPX order: S T A / M P X */
        .stampx-grid {
            grid-template-areas:
                "subjects actions styles"
                "lighting framing technical";
        }

        .stampx-header .subtitle-container {
            flex-direction: column;
            gap: 0.6rem;
        }

        .stampx-header .workflow-step {
            white-space: nowrap;
        }

        /* STAMPX letters: each in its own colour, bolder than the word after it.
           The fill override lets them show inside gradient-clipped headings. */
        .ltr {
            font-weight: 900;
            font-size: 1.2em;
            line-height: 1;
            background: none;
            -webkit-text-fill-color: currentColor;
            text-shadow: 0 0 10px currentColor;
        }

        .ltr-S { color: #6ee7b7; }
        .ltr-T { color: #67e8f9; }
        .ltr-A { color: #fcd34d; }
        .ltr-M { color: #fca5a5; }
        .ltr-P { color: #5eead4; }
        .ltr-X { color: #c4b5fd; }

        .section-title .ltr {
            margin-right: 0.15em;
        }

        /* ===== Compact layout: whole builder fits on one screen ===== */
        .app-container {
            padding: 0.5rem 0.75rem 0.15rem;
        }

        .top-bar {
            position: absolute;
            top: 0.5rem;
            left: 0.75rem;
            margin: 0;
            z-index: 5;
        }

        .stampx-header {
            margin-bottom: 0.6rem;
        }

        .stampx-header .title {
            font-size: 1.5rem;
            margin-bottom: 0.35rem;
        }

        .stampx-header .app-logo {
            width: 32px;
            height: 32px;
        }

        .stampx-header .subtitle-container {
            margin-top: 0;
        }

        .components-area {
            margin-bottom: 0.75rem;
        }

        .stampx-grid {
            gap: 0.6rem;
        }

        .stampx-grid .component-section {
            padding: 0.6rem 0.75rem 0.75rem;
        }

        .stampx-grid .section-title {
            margin-bottom: 0.15rem;
        }

        .stampx-grid .section-title::after {
            display: none;
        }

        .stampx-grid .component-list {
            gap: 0.35rem;
        }

        .workspace {
            flex: none;
            padding: 0.6rem 0.9rem;
            gap: 1rem;
        }

        .drop-zone.slots {
            min-height: 90px;
            padding: 0.75rem;
            gap: 0.4rem;
        }

        .drop-zone .prompt-component {
            padding: 0.4rem 0.8rem;
            font-size: 0.85rem;
        }

        /* Fill the screen height: the letter boxes share any spare height and
           centre their contents, so tall screens don't end in an empty band. */
        @media (min-width: 769px) {
            .components-area {
                flex: 1;
                display: flex;
                flex-direction: column;
                margin-bottom: clamp(0.75rem, 2vh, 1.25rem);
            }

            .stampx-grid {
                flex: 1;
                grid-auto-rows: 1fr;
                gap: clamp(0.6rem, 1.6vh, 1rem);
            }

            .stampx-grid .component-section {
                display: flex;
                flex-direction: column;
                justify-content: center;
                padding: clamp(0.6rem, 2vh, 1.4rem) 0.9rem;
            }

            .stampx-header {
                margin-bottom: clamp(0.6rem, 1.8vh, 1.1rem);
            }
        }

        /* Shorter screens: slimmer chips leave room for the footer */
        @media (min-width: 769px) and (max-height: 819px) {
            .stampx-grid .component-item {
                padding-top: 0.28rem;
                padding-bottom: 0.28rem;
            }
        }

        /* Taller screens: bigger chips and prompt area so the boxes look full, not padded.
           Shorter screens keep the compact sizes so nothing needs scrolling. */
        @media (min-width: 769px) and (min-height: 820px) {
            .stampx-grid .section-title {
                font-size: clamp(0.95rem, 2.3vh, 1.3rem);
                margin-bottom: clamp(0.15rem, 0.8vh, 0.5rem);
            }

            .stampx-grid .letter-hint {
                font-size: clamp(0.78rem, 1.9vh, 1.05rem);
                margin-bottom: clamp(0.45rem, 1.4vh, 1rem);
            }

            .stampx-grid .component-list {
                gap: clamp(0.4rem, 1vh, 0.7rem);
            }

            .stampx-grid .component-item {
                font-size: clamp(0.75rem, 1.55vh, 1rem);
                padding: clamp(0.35rem, 0.75vh, 0.6rem) clamp(0.6rem, 1.2vh, 0.9rem);
            }

            .drop-zone.slots,
            .prompt-area #promptDisplay {
                min-height: clamp(90px, 15vh, 180px);
            }
        }

        /* Letter badges replace the step numbers */
        .stampx-grid .component-section::before {
            width: 30px;
            height: 30px;
            top: 10px;
            left: 10px;
            right: auto;
            font-size: 0.95rem;
            animation: none;
        }
        .stampx-grid .subjects-section::before { content: 'S'; }
        .stampx-grid .lighting-section::before { content: 'M'; }
        .stampx-grid .actions-section::before { content: 'T'; }

        .letter-hint {

        .component-section.filled {
            border-color: rgba(255, 255, 255, 0.75);
        }

        .component-section .done-tick {
            position: absolute;
            top: 0.6rem;
            right: 0.75rem;
            font-size: 0.9rem;
            color: #fff;
            opacity: 0;
            transform: scale(0.3);
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);

        .component-section.filled .done-tick {
            opacity: 1;
            transform: scale(1);
        }

        /* X chips */
        .component-item[data-category="exclusions"] {

        .component-item.picked {
            outline: 2px solid #fff;

        }

        .prompt-component[data-category="actions"] {
            background: linear-gradient(135deg, #06b6d4, #0891b2);
        }

        .prompt-component[data-category="exclusions"] {
            background: linear-gradient(135deg, #8b5cf6, #7c3aed);

        /* Top bar: nav, mode tabs, stats */
        .top-bar {

            gap: 0.75rem;
            flex-wrap: wrap;

        .nav-pill {

            background: rgba(255, 255, 255, 0.1);

            border: 1px solid rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            color: #fff;
            font: inherit;
            font-size: 0.8rem;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
        }

        .nav-pill:hover {
            background: rgba(255, 255, 255, 0.18);
            transform: translateY(-1px);
        }

        /* Workflow letters light up as they are filled */
        .workflow-step.done {
            background: rgba(255, 255, 255, 0.2);
            border-color: var(--letter-color);
            color: #fff;
            box-shadow: 0 0 12px var(--letter-color);
        }

        .workflow-step.done::after {
            content: ' ✓';
            font-weight: 800;
        }

        .workflow-step[data-letter="S"] { --letter-color: #6ee7b7; }
        .workflow-step[data-letter="T"] { --letter-color: #67e8f9; }
        .workflow-step[data-letter="A"] { --letter-color: #fcd34d; }
        .workflow-step[data-letter="M"] { --letter-color: #fca5a5; }
        .workflow-step[data-letter="P"] { --letter-color: #5eead4; }
        .workflow-step[data-letter="X"] { --letter-color: #c4b5fd; }

        /* Drop zone shows six fixed slots */
        .drop-zone.slots {
            align-content: center;
        }

        .slot {
            padding: 0.35rem 0.75rem;
            border-radius: 16px;
            border: 2px dashed rgba(255, 255, 255, 0.35);
            color: rgba(255, 255, 255, 0.6);
            font-size: 0.85rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }

        .slot b {
            font-weight: 800;
            color: rgba(255, 255, 255, 0.85);
        }

        .prompt-component .slot-letter {
            font-weight: 800;
            background: rgba(255, 255, 255, 0.25);
            border-radius: 6px;
            padding: 0 0.35rem;
        }

        #promptDisplay {
            height: auto;
            min-height: 90px;
            padding: 0.9rem 1rem;
            margin-bottom: 0.4rem;
            line-height: 1.7;
        }

        #promptDisplay.loading {
            color: rgba(255, 255, 255, 0.6);
            font-style: italic;
        }

        /* Colour-coded prompt */
        .prompt-display .part {
            border-bottom: 3px solid;
            padding-bottom: 1px;
        }
        .prompt-display .part-S { border-color: #10b981; }
        .prompt-display .part-T { border-color: #06b6d4; }
        .prompt-display .part-A { border-color: #f59e0b; }
        .prompt-display .part-M { border-color: #ef4444; }
        .prompt-display .part-P { border-color: #14b8a6; }
        .prompt-display .part-X { border-color: #8b5cf6; }

        .missing-hint {
            font-size: 0.8rem;
            color: rgba(255, 255, 255, 0.8);
            text-align: center;
            min-height: 1.2em;
        }

        .missing-hint.complete {
            color: #6ee7b7;
            font-weight: 700;
        }

        /* Celebration burst */
        .burst {
            position: fixed;
            top: 40%;
            left: 50%;
            width: 10px;
            height: 10px;
            border-radius: 3px;
            pointer-events: none;
            z-index: 2000;
            animation: burstOut 1.2s cubic-bezier(0.2, 0.8, 0.3, 1) forwards;
        }

        @keyframes burstOut {
            0% { transform: translate(0, 0) rotate(0); opacity: 1; }
            100% { transform: translate(var(--dx), var(--dy)) rotate(540deg); opacity: 0; }
        }

        @media (prefers-reduced-motion: reduce) {
            .burst { display: none; }
        }

        /* Credit for the STAMPX framework */
        .credit {
            margin: 0.15rem 0 0;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.4rem;

        .credit img {

            color: rgba(255, 255, 255, 0.95);

        @media (max-width: 768px) {
            .stampx-grid {
                grid-template-areas:
                    "subjects"
                    "actions"
                    "styles"
                    "lighting"
                    "framing"
                    "technical";
            }

            .top-bar {
                position: static;
                justify-content: center;
                margin-bottom: 0.5rem;
            }
        }

<body>
    <!-- Animated Background Particles -->
    <div class="particles" id="particles"></div>

    <div class="app-container">
        <!-- Header -->
        <div class="header stampx-header">
            <h1 class="title">
                <div class="app-logo"></div>
                <span>Image Prompting with <span class="ltr ltr-S">S</span><span class="ltr ltr-T">T</span><span class="ltr ltr-A">A</span><span class="ltr ltr-M">M</span><span class="ltr ltr-P">P</span><span class="ltr ltr-X">X</span></span>

        </footer>
    </div>

    <script>
        // ===== STAMPX data =====
        // Each letter reuses one of the builder's section colours and sounds.
        const LETTERS = [
            {
                key: 'S', name: 'Subject', category: 'subject', section: 'subjects-section',
                hint: 'Who or what is in the image.',
                tooltip: 'S, Subject: who or what is in the image. People, objects, products, animals, places, key traits or appearance.',
                chips: [
                    { label: 'Barista', icon: 'fa-coffee', value: 'A Malaysian barista in her 30s in a white apron' },
                    { label: 'Chef', icon: 'fa-utensils', value: 'A smiling chef in a crisp white uniform' },
                    { label: 'Student', icon: 'fa-user-graduate', value: 'A university student with a canvas backpack' },
                    { label: 'Golden retriever', icon: 'fa-dog', value: 'A fluffy golden retriever' },
                    { label: 'Vintage car', icon: 'fa-car', value: 'A red 1960s vintage car' },

            },

                chips: [
                    { label: 'Pouring latte', icon: 'fa-mug-hot', value: 'pouring latte art at a wooden counter' },
                    { label: 'Running', icon: 'fa-running', value: 'running along a sandy beach' },
                    { label: 'Reading', icon: 'fa-book', value: 'reading a book in a cosy café' },
                    { label: 'Presenting', icon: 'fa-users', value: 'presenting to a small team in a meeting room' },
                    { label: 'Cooking', icon: 'fa-fire', value: 'stirring a pot over an open flame' },
                    { label: 'Walking', icon: 'fa-walking', value: 'walking down a quiet tree-lined street' },
                    { label: 'Holding product', icon: 'fa-hand-holding', value: 'holding the product up towards the camera' },
                    { label: 'Parked', icon: 'fa-road', value: 'parked on a quiet city street' },

            {

                    { label: 'Cinematic', icon: 'fa-film', value: 'cinematic film still' },
                    { label: 'Watercolour', icon: 'fa-paint-brush', value: 'soft watercolour painting' },
                    { label: 'Pencil sketch', icon: 'fa-pencil-alt', value: 'detailed pencil sketch' },

                ]
            },
            {
                key: 'M', name: 'Mood & Lighting', category: 'lighting', section: 'lighting-section',
                hint: 'How it feels and how it is lit.',
                tooltip: 'M, Mood & Lighting: how the image feels and how it is lit. Atmosphere, colour mood, light source, time of day and contrast.',
                chips: [
                    { label: 'Warm', icon: 'fa-sun', value: 'warm, inviting mood' },
                    { label: 'Calm', icon: 'fa-leaf', value: 'calm, peaceful mood' },
                    { label: 'Energetic', icon: 'fa-bolt', value: 'energetic, lively mood' },
                    { label: 'Moody', icon: 'fa-adjust', value: 'moody, dramatic shadows' },
                    { label: 'Golden morning', icon: 'fa-cloud-sun', value: 'golden morning light' },
                    { label: 'Soft window light', icon: 'fa-border-all', value: 'soft window light' },
                    { label: 'Overcast', icon: 'fa-cloud', value: 'soft overcast light' },
                    { label: 'Sunset glow', icon: 'fa-cloud-sun', value: 'glowing orange sunset light' },
                    { label: 'Neon night', icon: 'fa-moon', value: 'vivid neon lights at night' },
                    { label: 'Studio light', icon: 'fa-lightbulb', value: 'even studio lighting' }
                ]
            },
            {
                key: 'P', name: 'Perspective & Framing', category: 'framing', section: 'framing-section',
                hint: 'How the camera sees the scene.',
                tooltip: 'P, Perspective & Framing: how the camera sees and arranges the scene. Shot size, angle, viewpoint and composition.',
                chips: [
                    { label: 'Close-up', icon: 'fa-search-plus', value: 'close-up shot' },
                    { label: 'Medium shot', icon: 'fa-user', value: 'medium shot' },
                    { label: 'Wide shot', icon: 'fa-expand', value: 'wide shot' },
                    { label: 'Eye level', icon: 'fa-eye', value: 'eye-level angle' },
                    { label: 'Low angle', icon: 'fa-angle-up', value: 'low angle looking up' },
                    { label: 'High angle', icon: 'fa-angle-down', value: 'high angle looking down' },
                    { label: "Bird's-eye", icon: 'fa-dove', value: "bird's-eye view from directly above" },
                    { label: 'Over the shoulder', icon: 'fa-user-friends', value: 'over-the-shoulder shot' },
                    { label: 'Centred', icon: 'fa-crosshairs', value: 'subject centred in frame' },
                    { label: 'Off-centre', icon: 'fa-th', value: 'subject off-centre in frame' }
                ]
            },
            {
                key: 'X', name: 'eXclusions', category: 'exclusions', section: 'technical-section',
                hint: 'What should not appear.',
                tooltip: 'X, eXclusions: what should NOT appear. Unwanted objects, visual defects, style mistakes or distractions.',
                chips: [
                    { label: 'No text', icon: 'fa-ban', value: 'no text' },
                    { label: 'No watermark', icon: 'fa-ban', value: 'no watermark' },
                    { label: 'No blur', icon: 'fa-ban', value: 'no blur' },
                    { label: 'No crowds', icon: 'fa-ban', value: 'no crowds' },
                    { label: 'No cartoon effect', icon: 'fa-ban', value: 'no cartoon effect' },
                    { label: 'No plastic skin', icon: 'fa-ban', value: 'no plastic-looking skin' },
                    { label: 'No extra fingers', icon: 'fa-ban', value: 'no extra fingers' },
                    { label: 'No distorted hands', icon: 'fa-ban', value: 'no distorted hands' },
                    { label: 'No HDR look', icon: 'fa-ban', value: 'no HDR look' }
                ]
            }
        ];

        const LETTER_BY_KEY = Object.fromEntries(LETTERS.map(l => [l.key, l]));

        // ===== State =====
        // picks: { S: [chip, ...], T: [chip, ...], ..., X: [chip, ...] }
        let picks = {};

        let dropZone, promptDisplay, missingHint, copyButton, clearAllButton;

        // ===== Audio (same tones as the builder) =====
        let audioContext;
        let soundEnabled = true;

        function initAudio() {
            try {
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
            } catch (e) {
                soundEnabled = false;
            }
        }

        function playTone(frequency, waveType, duration, volume = 0.1, delay = 0) {
            if (!soundEnabled || !audioContext) return;
            setTimeout(() => {
                const oscillator = audioContext.createOscillator();
                const gainNode = audioContext.createGain();
                oscillator.connect(gainNode);
                gainNode.connect(audioContext.destination);
                oscillator.type = waveType;
                oscillator.frequency.setValueAtTime(frequency, audioContext.currentTime);
                gainNode.gain.setValueAtTime(0, audioContext.currentTime);
                gainNode.gain.linearRampToValueAtTime(volume, audioContext.currentTime + 0.01);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + duration);
                oscillator.start(audioContext.currentTime);
                oscillator.stop(audioContext.currentTime + duration);
            }, delay);
        }

        function playSound(category) {
            const tones = {
                subject: [523.25, 'sine', 0.15],
                actions: [587.33, 'triangle', 0.13],
                style: [659.25, 'triangle', 0.12],
                lighting: [783.99, 'sawtooth', 0.1],
                framing: [493.88, 'triangle', 0.11],
                exclusions: [440.00, 'square', 0.08]
            };
            const [frequency, waveType, duration] = tones[category] || [500, 'sine', 0.1];
            playTone(frequency, waveType, duration);
        }

        function playSuccessSound() {
            [523.25, 659.25, 783.99].forEach((freq, i) => playTone(freq, 'sine', 0.2, 0.05, i * 50));
        }

        function playClearSound() {
            if (!soundEnabled || !audioContext) return;
            const oscillator = audioContext.createOscillator();
            const gainNode = audioContext.createGain();
            oscillator.connect(gainNode);
            gainNode.connect(audioContext.destination);
            oscillator.type = 'sawtooth';
            oscillator.frequency.setValueAtTime(300, audioContext.currentTime);
            oscillator.frequency.exponentialRampToValueAtTime(150, audioContext.currentTime + 0.3);
            gainNode.gain.setValueAtTime(0, audioContext.currentTime);
            gainNode.gain.linearRampToValueAtTime(0.08, audioContext.currentTime + 0.02);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.3);
            oscillator.start(audioContext.currentTime);
            oscillator.stop(audioContext.currentTime + 0.3);
        }

        // ===== Analytics =====
        function trackEvent(eventName, parameters = {}) {
            if (typeof gtag !== 'undefined') {
                gtag('event', eventName, parameters);
            }
        }

        // ===== Rendering =====
        function renderGuide() {
            const guide = document.getElementById('workflowGuide');
            guide.innerHTML = LETTERS.map((l, i) =>
                `${i ? '<span class="workflow-arrow">→</span>' : ''}<span class="workflow-step" data-letter="${l.key}"><span class="ltr ltr-${l.key}">${l.key}</span> ${l.name}</span>`
            ).join('');
        }

        function renderGrid() {
            const grid = document.getElementById('letterGrid');
            grid.innerHTML = LETTERS.map(l => `
                <div class="component-section ${l.section} tooltip-trigger" data-letter="${l.key}" data-tooltip="${l.tooltip}">
                    <i class="fas fa-check-circle done-tick"></i>
                    <h3 class="section-title"><span class="ltr ltr-${l.key}">${l.key}</span> ${l.name}</h3>
                    <p class="letter-hint">${l.hint} <em>Pick one or more.</em></p>
                    <div class="component-list">
                        ${l.chips.map((c, i) => `
                            <div class="component-item" data-letter="${l.key}" data-index="${i}" data-category="${l.category}" draggable="true">
                                <i class="fas ${c.icon}"></i>
                                ${c.label}
                            </div>`).join('')}
                    </div>
                </div>`).join('');
        }

        function chipFrom(el) {
            const letter = LETTER_BY_KEY[el.dataset.letter];
            return { letter, chip: letter.chips[Number(el.dataset.index)] };
        }

        function picksFor(key) {
            return picks[key] || [];
        }

        function isFilled(key) {
            return picksFor(key).length > 0;
        }

        function filledCount() {
            return LETTERS.filter(l => isFilled(l.key)).length;
        }

        function updateGameState() {
            renderDropZone();
            renderPrompt();
            renderProgressMarks();
        }

        function renderDropZone() {
            dropZone.innerHTML = '';
            LETTERS.forEach(l => {
                const chosen = picksFor(l.key);
                if (chosen.length === 0) {
                    const slot = document.createElement('div');
                    slot.className = 'slot';
                    slot.innerHTML = `<span class="ltr ltr-${l.key}">${l.key}</span> ${l.name}`;
                    dropZone.appendChild(slot);
                    return;
                }
                chosen.forEach(chip => {
                    const el = document.createElement('div');
                    el.className = 'prompt-component';
                    el.dataset.category = l.category;
                    el.innerHTML = `<span class="slot-letter">${l.key}</span><span></span>
                        <button class="remove-btn" aria-label="Remove ${chip.label}"><i class="fas fa-times"></i></button>`;
                    el.children[1].textContent = chip.label;
                    el.querySelector('.remove-btn').addEventListener('click', () => removePick(l.key, chip));
                    dropZone.appendChild(el);
                });
            });
        }

        // Join the picks into one flowing description, in STAMPX reading order.
        // Several picks for one letter read as a list: "a, b and c".
        function buildPromptParts() {
            const parts = [];
            const add = (key, text) => parts.push({ key, text });
            const S = joinValues('S'), T = joinValues('T');
            if (S) add('S', S);
            if (T) add('T', S ? ' ' + T : capitalise(T));
            if (S || T) parts.push({ text: '. ' });
            // Look and feel: Aesthetic, Mood, Perspective as one sentence
            let first = true;
            ['A', 'M', 'P'].forEach(key => {
                const text = joinValues(key);
                if (!text) return;
                add(key, first ? capitalise(text) : ', ' + text);
                first = false;
            });
            if (!first) parts.push({ text: '. ' });
            if (isFilled('X')) {
                add('X', capitalise(picksFor('X').map(c => c.value).join(', ')));
                parts.push({ text: '.' });
            }
            return parts;
        }

        function joinValues(key) {
            const values = picksFor(key).map(c => c.value);
            if (values.length < 2) return values[0] || '';
            return `${values.slice(0, -1).join(', ')} and ${values[values.length - 1]}`;
        }

        function capitalise(text) {
            return text.charAt(0).toUpperCase() + text.slice(1);
        }

        // Fallback when the AI is unavailable: the STAMPX parts joined in order,
        // each underlined in its letter's colour.
        function renderLocalPrompt(parts) {
            promptDisplay.innerHTML = '';
            promptDisplay.appendChild(document.createTextNode('Generate an image: '));
            parts.forEach(p => {
                if (!p.key) {
                    promptDisplay.appendChild(document.createTextNode(p.text));
                    return;
                }
                // Keep leading joiners (", in ") outside the underline
                const lead = p.text.match(/^[ ,]*(?:in )?/i)[0];
                if (lead) promptDisplay.appendChild(document.createTextNode(lead));
                const span = document.createElement('span');
                span.className = `part part-${p.key}`;
                span.title = LETTER_BY_KEY[p.key].name;
                span.textContent = p.text.slice(lead.length);
                promptDisplay.appendChild(span);
            });
        }

        // Same AI endpoint as the builder. Rapid taps are batched into one call,
        // and only the newest reply is shown.
        let enhanceTimer = null;
        let enhanceRequest = 0;

        function scheduleEnhance(parts) {
            clearTimeout(enhanceTimer);
            const requestId = ++enhanceRequest;
            promptDisplay.classList.add('loading');
            promptDisplay.textContent = 'Generating prompt...';
            enhanceTimer = setTimeout(() => enhancePrompt(parts, requestId), 600);
        }

        async function enhancePrompt(parts, requestId) {
            const components = LETTERS.flatMap(l =>
                picksFor(l.key).map(c => ({ category: `${l.key}: ${l.name}`, value: c.value }))
            );

            let prompt = null;
            try {
                const response = await fetch('/api/generate-prompt', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ components, format: 'stampx' })
                });
                const data = await response.json();
                if (!response.ok || !data.prompt) throw new Error(data.error || 'No prompt returned');
                prompt = data.prompt.startsWith('Generate an image:') ? data.prompt : `Generate an image: ${data.prompt}`;
            } catch (error) {
                console.error('Prompt generation failed:', error);
            }

            if (requestId !== enhanceRequest) return; // a newer pick is on its way
            promptDisplay.classList.remove('loading');
            if (prompt) {
                promptDisplay.textContent = prompt;
                trackEvent('stampx_prompt_enhanced', { letters: filledCount() });
            } else {
                renderLocalPrompt(parts);
            }
        }

        function renderPrompt() {
            const parts = buildPromptParts();
            const missing = LETTERS.filter(l => !isFilled(l.key));

            if (parts.length === 0) {
                clearTimeout(enhanceTimer);
                enhanceRequest++;
                promptDisplay.classList.remove('loading');
                promptDisplay.textContent = 'Your STAMPX prompt will appear here...';
                promptDisplay.classList.add('empty');
            } else {
                promptDisplay.classList.remove('empty');
                scheduleEnhance(parts);
            }

            if (missing.length === 0) {
                missingHint.textContent = '🏆 All six letters! Copy the prompt and paste it into ChatGPT or Gemini.';
                missingHint.classList.add('complete');
            } else {
                missingHint.classList.remove('complete');
                missingHint.textContent = missing.length === LETTERS.length
                    ? ''
                    : `Still missing: ${missing.map(l => `${l.key} (${l.name})`).join(', ')}. Without ${missing.length > 1 ? 'them' : 'it'}, the AI guesses.`;
            }
        }

        function renderProgressMarks() {
            LETTERS.forEach(l => {
                const filled = isFilled(l.key);
                document.querySelector(`.workflow-step[data-letter="${l.key}"]`).classList.toggle('done', filled);
                document.querySelector(`.component-section[data-letter="${l.key}"]`).classList.toggle('filled', filled);
            });
            document.querySelectorAll('.component-item').forEach(el => {
                const { letter, chip } = chipFrom(el);
                el.classList.toggle('picked', picksFor(letter.key).includes(chip));
            });
        }

        // ===== Build mode =====
        function addPick(letter, chip) {
            const wasFilled = isFilled(letter.key);
            const before = filledCount();

            const list = picksFor(letter.key);
            if (list.includes(chip)) {
                showNotification('Already added', 'warning');
                return;
            }
            picks[letter.key] = [...list, chip];

            updateGameState();
            playSuccessSound();

            if (!wasFilled) {
                showNotification(`${letter.key} · ${letter.name} done!`, 'success');
            } else {
                showNotification(`${letter.key} · ${chip.label} added`, 'success');
            }

            if (before < LETTERS.length && filledCount() === LETTERS.length) {
                celebrate();
                showNotification('Full STAMPX prompt! 🎉', 'success');
                trackEvent('stampx_prompt_completed');
            }

            trackEvent('stampx_chip_added', { letter: letter.key, value: chip.value });
        }

        function removePick(key, chip) {
            picks[key] = picksFor(key).filter(c => c !== chip);
            updateGameState();
            showNotification('Removed', 'info');
        }

        function clearAll() {
            if (filledCount() === 0) {
                showNotification('Nothing to clear yet!', 'info');
                return;
            }
            playClearSound();
            picks = {};
            updateGameState();
            showNotification('All cleared. Try a new combination!', 'success');
            trackEvent('stampx_cleared');
        }

        function initializeChips() {
            document.querySelectorAll('.component-item').forEach(item => {
                item.addEventListener('click', function () {
                    const { letter, chip } = chipFrom(this);
                    playSound(letter.category);
                    addPick(letter, chip);
                    this.style.transform = 'scale(0.9) rotate(-5deg)';
                    setTimeout(() => { this.style.transform = ''; }, 200);
                });
                item.addEventListener('dragstart', function (e) {
                    e.dataTransfer.setData('text/plain', JSON.stringify({ letter: this.dataset.letter, index: this.dataset.index }));
                    this.style.opacity = '0.5';
                    playSound(this.dataset.category);
                });
                item.addEventListener('dragend', function () {
                    this.style.opacity = '1';
                });
            });

            dropZone.addEventListener('dragover', e => e.preventDefault());
            dropZone.addEventListener('dragenter', e => {
                e.preventDefault();
                dropZone.classList.add('drag-over');
            });
            dropZone.addEventListener('dragleave', e => {
                if (!dropZone.contains(e.relatedTarget)) dropZone.classList.remove('drag-over');
            });
            dropZone.addEventListener('drop', e => {
                e.preventDefault();
                dropZone.classList.remove('drag-over');
                try {
                    const data = JSON.parse(e.dataTransfer.getData('text/plain'));
                    const letter = LETTER_BY_KEY[data.letter];
                    if (letter) addPick(letter, letter.chips[Number(data.index)]);
                } catch (err) { /* not one of our chips */ }
            });
        }

        // ===== Copy =====
        function copyPrompt() {
            const text = promptDisplay.textContent.trim();
            if (promptDisplay.classList.contains('empty') || !text) {
                showNotification('No prompt yet! Tap a chip in each box first.', 'warning');
                return;
            }
            if (promptDisplay.classList.contains('loading')) {
                showNotification('Still writing your prompt. One moment!', 'warning');
                return;
            }
            const done = () => {
                showNotification('Prompt copied to clipboard!', 'success');
                copyButton.innerHTML = '<i class="fas fa-check"></i> Copied!';
                setTimeout(() => { copyButton.innerHTML = '<i class="fas fa-copy"></i> Copy Prompt'; }, 2000);
                trackEvent('stampx_prompt_copied', { letters: filledCount() });
            };
            if (navigator.clipboard && window.isSecureContext) {
                navigator.clipboard.writeText(text).then(done).catch(() => fallbackCopy(text, done));
            } else {
                fallbackCopy(text, done);
            }
        }

        function fallbackCopy(text, done) {
            const textArea = document.createElement('textarea');
            textArea.value = text;
            textArea.style.position = 'fixed';
            textArea.style.opacity = '0';
            document.body.appendChild(textArea);
            textArea.select();
            try {
                if (document.execCommand('copy')) done();
                else throw new Error('copy failed');
            } catch (err) {
                showNotification('Copy failed. Please select and copy the prompt manually.', 'error');
            }
            document.body.removeChild(textArea);
        }

        // ===== Effects =====
        function celebrate() {
            const colours = ['#10b981', '#ef4444', '#06b6d4', '#14b8a6', '#f59e0b', '#8b5cf6', '#ffffff'];
            for (let i = 0; i < 40; i++) {
                const piece = document.createElement('div');
                piece.className = 'burst';
                const angle = Math.random() * Math.PI * 2;
                const distance = 150 + Math.random() * 250;
                piece.style.background = colours[i % colours.length];
                piece.style.setProperty('--dx', `${Math.cos(angle) * distance}px`);
                piece.style.setProperty('--dy', `${Math.sin(angle) * distance}px`);
                document.body.appendChild(piece);
                setTimeout(() => piece.remove(), 1300);
            }
        }

        function createParticles() {
            const particlesContainer = document.getElementById('particles');
            const shapes = ['circle', 'square', 'triangle', 'diamond'];
            for (let i = 0; i < 20; i++) {
                const particle = document.createElement('div');
                const shape = shapes[Math.floor(Math.random() * shapes.length)];
                particle.className = `particle ${shape}`;
                particle.style.left = Math.random() * 100 + '%';
                particle.style.top = Math.random() * 100 + '%';
                if (shape === 'triangle') {
                    const size = Math.random() * 3 + 2;
                    particle.style.borderLeftWidth = size + 'px';
                    particle.style.borderRightWidth = size + 'px';
                    particle.style.borderBottomWidth = (size * 2) + 'px';
                } else {
                    const size = Math.random() * 8 + 4;
                    particle.style.width = size + 'px';
                    particle.style.height = size + 'px';
                }
                particle.style.animationDelay = Math.random() * 12 + 's';
                particle.style.animationDuration = (Math.random() * 5 + 10) + 's';
                particlesContainer.appendChild(particle);
            }
        }

        function showNotification(message, type = 'success') {
            const notification = document.createElement('div');
            notification.className = `notification ${type}`;
            notification.textContent = message;
            document.body.appendChild(notification);
            setTimeout(() => notification.classList.add('show'), 100);
            setTimeout(() => {
                notification.classList.remove('show');
                setTimeout(() => notification.remove(), 400);
            }, 3000);
        }

        function initializeTooltips() {
            const tooltip = document.getElementById('dynamicTooltip');
            document.querySelectorAll('.tooltip-trigger').forEach(trigger => {
                trigger.addEventListener('mouseenter', function () {
                    tooltip.textContent = this.getAttribute('data-tooltip');
                    tooltip.classList.add('show');
                });
                trigger.addEventListener('mousemove', function (e) {
                    tooltip.style.left = e.clientX + 'px';
                    tooltip.style.top = e.clientY + 'px';
                });
                trigger.addEventListener('mouseleave', function () {
                    tooltip.classList.remove('show');
                });
            });
        }

        // ===== Start =====
        document.addEventListener('DOMContentLoaded', function () {
            dropZone = document.getElementById('dropZone');
            promptDisplay = document.getElementById('promptDisplay');
            missingHint = document.getElementById('missingHint');
            copyButton = document.getElementById('copyButton');
            clearAllButton = document.getElementById('clearAllButton');

            initAudio();
            createParticles();
            renderGuide();
            renderGrid();
            initializeChips();
            initializeTooltips();
            updateGameState();

            copyButton.addEventListener('click', copyPrompt);
            clearAllButton.addEventListener('click', clearAll);
            document.addEventListener('click', function enableAudio() {
                if (audioContext && audioContext.state === 'suspended') audioContext.resume();
            }, { once: true });

            if ('serviceWorker' in navigator) {
                navigator.serviceWorker.register('/sw.js').catch(() => {});
            }
            trackEvent('stampx_page_loaded');
        });
    </script>
    <!-- Dynamic Tooltip -->
    <div class="dynamic-tooltip" id="dynamicTooltip"></div>

</body>
</html>
